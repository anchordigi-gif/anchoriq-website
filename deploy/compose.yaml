# anchoriq.io website on the shared VPS (prepared, not deployed). Lives in /opt/projects/anchoriq-website
# with the public site checked out in ./site. Nothing is published: the shared edge reaches `web` over
# the internal network edge_anchoriq_website (edge fixed address 172.30.22.2). See deploy/README.md.
name: anchoriq-website
services:
  web:
    image: nginx:1.28.1-alpine@sha256:52e3ada4d978443601f286cc2f9e7b95c82aa3ad5a78ce9c6b94ce00258e68cc
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }   # errors only (no client addresses)
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    volumes:
      - ./web.nginx.conf:/etc/nginx/nginx.conf:ro
      - ./csp.conf:/etc/nginx/csp.conf:ro
      - ./page-headers.conf:/etc/nginx/page-headers.conf:ro
      - ./site:/srv/site:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./acme-webroot:/var/www/acme:ro
      - ./logs:/var/log/website   # request logs (owner uid 101 = nginx); retention.sh deletes old days
    depends_on:
      forms: { condition: service_healthy }
    networks:
      internal: {}
      edge:
        aliases: [anchoriq-website-web]

  forms:
    image: node:24.22.3-alpine@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 10m, max-file: '3' } }   # errors only (no client addresses)
    user: node
    read_only: true
    working_dir: /home/node
    command: [node, /srv/site/server/forms.mjs]
    environment:
      HOST: 0.0.0.0
      PORT: '8300'
      DB_PATH: /home/node/enquiries.sqlite
      TRUST_PROXY: '1'
      # Enquiries open: demo requests and waitlist signups are saved and emailed. To close them again set '0' and
      # run tools/enquiries-mode.py closed (keep both the same).
      FORMS_OPEN: '1'
    # Email notifications to hello@anchordigi.com: ./secrets/smtp.env (root, 600; never in Git) holds SMTP_HOST,
    # SMTP_PORT, SMTP_USER, SMTP_PASS, NOTIFY_FROM and NOTIFY_TO. Compose reads it as root at start-up and passes it
    # only to this container. Without the file, notifications are off and enquiries are still saved. See deploy/README.md.
    env_file:
      - path: ./secrets/smtp.env
        required: false
    volumes:
      - ./site/server:/srv/site/server:ro
      - enquiries:/home/node   # the image owns /home/node as user node, so the new volume inherits it
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8300/api/forms/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal, egress]   # egress only for SMTP to smtp.hostinger.com:465 (email notifications); nothing is published

  # Certificate issue/renewal through the edge's port-80 pass-through (same pattern as app production).
  certbot:
    image: certbot/certbot:v5.9.0@sha256:bc93cb710b413e6b456d622f9b0133b3e109c0a78c2ed9976af43d209b0a1805
    profiles: [tools]
    volumes: ['./letsencrypt:/etc/letsencrypt', './acme-webroot:/var/www/acme']
    networks: [egress]
  certbot-issue:   # first certificate only: stands in for `web` on the edge network while nginx has no certificate yet
    image: certbot/certbot:v5.9.0@sha256:bc93cb710b413e6b456d622f9b0133b3e109c0a78c2ed9976af43d209b0a1805
    profiles: [tools]
    volumes: ['./letsencrypt:/etc/letsencrypt']
    command: [certonly, --standalone, --http-01-port, '8080', -d, anchoriq.io, -d, www.anchoriq.io, --email, '${CERT_EMAIL:?set CERT_EMAIL}', --agree-tos, --no-eff-email, --non-interactive]
    networks:
      egress: {}
      edge:
        aliases: [anchoriq-website-web]

networks:
  internal:
    internal: true
  edge:
    name: edge_anchoriq_website
    external: true
  egress: {}

volumes:
  enquiries:
    name: anchoriq_website_enquiries
