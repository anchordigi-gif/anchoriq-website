# Content-Security-Policy for every HTML page (included by web.nginx.conf; the local preview server reads the same line).
# 'unsafe-eval': support.js builds each page's logic with new Function (see LAUNCH.md). No inline scripts and no third-party hosts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
