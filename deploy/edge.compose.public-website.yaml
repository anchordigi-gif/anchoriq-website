# PROPOSED /opt/platform/edge/compose.yaml once publishing anchoriq.io is approved. The edge must have
# the fixed address 172.30.22.2 on edge_anchoriq_website: the website router believes PROXY protocol
# client addresses only from it. Staging keeps its loopback-only 8443.
name: platform-edge
services:
  edge:
    image: nginx:1.28.1-alpine@sha256:52e3ada4d978443601f286cc2f9e7b95c82aa3ad5a78ce9c6b94ce00258e68cc
    restart: unless-stopped
    # IPv4 and IPv6 (DNS has an AAAA record); IPv6 goes through Docker's proxy (see web.nginx.conf limits)
    ports: ['0.0.0.0:443:443', '0.0.0.0:80:80', '[::]:443:443', '[::]:80:80', '127.0.0.1:8443:8443']
    volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
    networks:
      default: {}
      edge_anchoriq_staging: {}
      edge_anchoriq_website:
        ipv4_address: 172.30.22.2
networks:
  edge_anchoriq_staging:
    external: true
  edge_anchoriq_website:
    external: true
