# PROPOSED shared edge for /opt/platform/edge/nginx.conf once publishing anchoriq.io is approved.
# Public: anchoriq.io and www.anchoriq.io only. app.anchoriq.io and every other name stay closed.
# Staging stays loopback-only on 8443, unchanged. Tested locally with deploy/test/run.sh.
worker_processes 1;
events { worker_connections 1024; }
stream {
  log_format sni '$remote_addr [$time_local] $ssl_preread_server_name $status $session_time';
  # Public visitors: no client address in the edge log (the website keeps addresses only in its 14-day files).
  log_format sni_public '[$time_local] $ssl_preread_server_name $status $session_time';
  access_log /dev/stdout sni;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $ssl_preread_server_name $public_project {
    anchoriq.io     anchoriq-website-web:8443;
    www.anchoriq.io anchoriq-website-web:8443;
    default         127.0.0.1:1;
  }
  map $ssl_preread_server_name $private_project {
    anchoriq-staging.localhost anchoriq-staging-web:8443;
    default                    127.0.0.1:1;
  }
  limit_conn_zone $binary_remote_addr zone=edge_conn:10m;
  server { listen 443; access_log /dev/stdout sni_public; ssl_preread on; proxy_protocol on; limit_conn edge_conn 200; proxy_connect_timeout 5s; proxy_pass $public_project; }
  server { listen 8443; ssl_preread on; proxy_connect_timeout 5s; proxy_pass $private_project; }
}
http {
  server_tokens off;
  access_log off;
  error_log /dev/stderr crit;
  resolver 127.0.0.11 valid=10s ipv6=off;
  limit_req_zone $binary_remote_addr zone=edge_http:10m rate=5r/s;
  limit_req_status 429;
  server {
    listen 80;
    limit_req zone=edge_http burst=20 nodelay;
    server_name anchoriq.io www.anchoriq.io;
    location / {
      set $router anchoriq-website-web:8080;
      proxy_pass http://$router;
      proxy_set_header Host $host;
    }
  }
  server { listen 80 default_server; return 444; }
}
