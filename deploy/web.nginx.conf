# anchoriq.io website router (prepared, not deployed). TLS ends here with the Let's Encrypt certificate
# for anchoriq.io and www.anchoriq.io; the shared edge only routes by SNI and prefixes PROXY protocol.
# Serves only the public files of the site and proxies /api/forms/ to the form handler.
worker_processes auto;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format path '$remote_addr [$time_local] "$request_method $uri" $status $request_time';
  # Request logs hold client addresses: one file per UTC day in ./logs (mounted at /var/log/website),
  # deleted by retention.sh after LOG_RETENTION_DAYS. Nothing with an address goes to the container log.
  map $time_iso8601 $logday { "~^(?<d>\d{4}-\d{2}-\d{2})" $d; default undated; }
  access_log /var/log/website/access-$logday.log path;
  open_log_file_cache max=4 inactive=60s;
  client_max_body_size 16k;
  limit_req_zone $binary_remote_addr zone=pages:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=forms:10m rate=6r/m;
  limit_req_status 429;

  # Plain HTTP reaches this router only via the edge's port 80: ACME HTTP-01 and the HTTPS redirect.
  server {
    listen 8080;
    server_name anchoriq.io www.anchoriq.io;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://anchoriq.io$request_uri; }
  }

  # www → apex (the canonical host).
  server {
    listen 8443 ssl proxy_protocol;
    set_real_ip_from 172.30.22.2;
    real_ip_header proxy_protocol;
    server_name www.anchoriq.io;
    ssl_certificate /etc/letsencrypt/live/anchoriq.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anchoriq.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://anchoriq.io$request_uri;
  }

  server {
    # PROXY protocol header believed only from the edge's fixed address on edge_anchoriq_website.
    listen 8443 ssl proxy_protocol default_server;
    set_real_ip_from 172.30.22.2;
    real_ip_header proxy_protocol;
    http2 on;
    server_name anchoriq.io;
    ssl_certificate /etc/letsencrypt/live/anchoriq.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anchoriq.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tls:10m;
    root /srv/site;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/forms/ {
      if ($request_uri !~ "^/api/forms/(demo|waitlist|health)$") { return 404; }
      limit_req zone=forms burst=5 nodelay;
      proxy_pass http://forms:8300;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;   # replaced, never appended: the handler trusts only this
      proxy_set_header X-Forwarded-For "";
    }

    location /assets/ {
      limit_req zone=pages burst=150 nodelay;
      add_header Cache-Control "public, max-age=86400" always;
      add_header Strict-Transport-Security "max-age=31536000" always;
      add_header X-Content-Type-Options nosniff always;
    }

    # Public files only: pages, robots and sitemap (scripts live under /assets/). Everything else in the checkout is 404.
    location = / { limit_req zone=pages burst=150 nodelay; include /etc/nginx/csp.conf; include /etc/nginx/page-headers.conf; try_files /index.html =404; }
    location ~ "^/([A-Z][A-Za-z]+\.dc\.html|index\.html)$" { limit_req zone=pages burst=150 nodelay; include /etc/nginx/csp.conf; include /etc/nginx/page-headers.conf; }
    location ~ "^/(robots\.txt|sitemap\.xml)$" { limit_req zone=pages burst=150 nodelay; add_header Cache-Control "public, max-age=3600" always; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always; }
    location / { return 404; }
  }
}
