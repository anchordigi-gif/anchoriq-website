<p class="a0" style="margin: 40px 0 0; max-width: 640px; font-size: 16px; line-height: 1.45; color: #9A9CA5">AnchorIQ is the business intelligence and analytics platform from Anchor Digital. It exists because sales and marketing teams have plenty of data and no single answer.</p>

</section><section style="max-width: 1760px; margin: 0 auto; padding: clamp(87px, 14.4vw, 208px) clamp(24px, 5vw, 96px) 0; box-sizing: border-box"><div class="split" style="align-items: center"><div data-rv="1"><h2 style="margin: 0; max-width: 820px; font-size: clamp(23px, 2.8vw, 34px); line-height: 1.12; letter-spacing: -0.025em; font-weight: 500; text-wrap: balance">Connected data. Clear intelligence.</h2><p style="margin: 20px 0 32px; max-width: 560px; font-size: 16px; color: #9A9CA5">Two strands that are usually kept apart, what marketing spends and what sales closes, joined at every step. That is the whole idea behind AnchorIQ.</p><div class="row" style="margin: 0 -8px; padding: 18px 8px; border-top: 1px solid #26282E; display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; align-items: baseline"><strong class="gtxt" style="font-size: 15px; font-weight: 600">Precision</strong><span style="font-size: 14px; color: #C9CBD2">Every figure has one definition, and the page says where it came from.</span></div><div class="row" style="margin: 0 -8px; padding: 18px 8px; border-top: 1px solid #26282E; display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; align-items: baseline"><strong class="gtxt" style="font-size: 15px; font-weight: 600">Clarity</strong><span style="font-size: 14px; color: #C9CBD2">Plain words and one screen, so the answer is read in seconds.</span></div><div class="row" style="margin: 0 -8px; padding: 18px 8px; border-top: 1px solid #26282E; display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; align-items: baseline"><strong class="gtxt" style="font-size: 15px; font-weight: 600">Progress</strong><span style="font-size: 14px; color: #C9CBD2">Each view ends in a next step, not just a number.</span></div><div class="row" style="margin: 0 -8px; padding: 18px 8px; border-top: 1px solid #26282E; display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; align-items: baseline"><strong class="gtxt" style="font-size: 15px; font-weight: 600">Reliability</strong><span style="font-size: 14px; color: #C9CBD2">When a source is stale or missing, the dashboard says so.</span></div><div class="row" style="margin: 0 -8px; padding: 18px 8px; border-top: 1px solid #26282E; display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; align-items: baseline"><strong class="gtxt" style="font-size: 15px; font-weight: 600">Intelligence</strong><span style="font-size: 14px; color: #C9CBD2">Insight that explains, with the evidence beside it.</span></div></div>

n="true" style="width: 10px; height: 10px; border-radius: 3px; background: linear-gradient(105deg, #2412BC 0%, #7634EF 50%, #E028DF 100%); margin-top: -34px; margin-bottom: 12px"></span><strong style="font-size: 19px; font-weight: 500; letter-spacing: -0.015em">Next release</strong><span style="font-size: 14px; color: #9A9CA5">Executive summary, Forecast and Compare. Dashboards, a report builder and scheduled reports. AI Insights and attribution. More advertising platforms. Data health, CSV import and optional CRM write-back.</span></li><li class="ben" data-rv="1" style="border-top: 1px solid #4A4D57; padding: 28px 32px 0 0; display: flex; flex-direction: column; gap: 12px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: linear-gradient(105deg, #2412BC 0%, #7634EF 50%, #E028DF 100%); margin-top: -34px; margin-bottom: 12px"></span><strong style="font-size: 19px; font-weight: 500; letter-spacing: -0.015em">Later</strong><span style="font-size: 14px; color: #9A9CA5">Marketplace templates, a mobile app for executives, prospect matching and billing.</span></li></ol></section><section id="contact" style="max-width: 1760px; margin: 0 auto; padding: clamp(87px, 14.4vw, 208px) clamp(24px, 5vw, 96px) 0; box-sizing: border-box"><div class="split" style="align-items: start"><div data-rv="1"><h2 style="margin: 0; max-width: 820px; font-size: clamp(23px, 2.8vw, 34px); line-height: 1.12; letter-spacing: -0.025em; font-weight: 500; text-wrap: balance">{{formTitle}}</h2><p style="margin: 20px 0 0; max-width: 520px; font-size: 16px; color: #9A9CA5">{{formIntro}}</p><p style="margin: 16px 0 0; font-size: 13px; color: #9A9CA5">We use your details only to respond to this request.</p><ol style="{{stepsStyle}}"><li class="row" style="margin: 0 -8px; padding: 16px 8px; border-top: 1px solid #26282E; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: baseline"><span class="gtx" aria-hidden="true" style="font-size: 13
