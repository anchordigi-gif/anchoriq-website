0; box-sizing: border-box"><div class="split" style="align-items: start"><h2 data-rv="1" style="margin: 0; max-width: 820px; font-size: clamp(23px, 2.8vw, 34px); line-height: 1.12; letter-spacing: -0.025em; font-weight: 500; text-wrap: balance">Pricing questions.</h2><div style="display: flex; flex-direction: column"><details style="border-top: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 56px; display: flex; align-items: center; font-size: 16px; font-weight: 500">What counts as a seat?</summary><p style="margin: 0 0 18px; max-width: 540px; font-size: 14px; color: #9A9CA5">Each person with their own login counts as one named user, including admins. Once you use the seats included in your package, extra users are billed at that package's seat rate.</p></details><details style="border-top: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 56px; display: flex; align-items: center; font-size: 16px; font-weight: 500">How do yearly payments work?</summary><p style="margin: 0 0 18px; max-width: 540px; font-size: 14px; color: #9A9CA5">The annual subscription and any annual extra seats are paid upfront. One-time onboarding is billed separately. For example, Starter with 8 users costs AED 946 a month, or AED 9,460 a year upfront, saving AED 1,892 on the subscription. Starter onboarding is an additional AED 5,000.</p></details><details style="border-top: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 56px; display: flex; align-items: center; font-size: 16px; font-weight: 500">What counts as a connection?</summary><p style="margin: 0 0 18px; max-width: 540px; font-size: 14px; color: #9A9CA5">A connection is one supported account, property or data feed. Two advertising accounts use two connections, even if both are on the same platform. Starter includes 3, Professional includes 5 and Enterprise includes 6 at the starting price.</p></details><details style="border-top: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 56px; display: flex; align-items: center; font-size: 16px; font-weight: 500">Is onboarding included in the price?</summary><p style="margin: 0 0 18px; max-width: 540px; font-size: 14px; color: #9A9CA5">No. A one-time onboarding fee is billed separately from your subscription: AED 5,000 for Starter and AED 8,000 for Professional. Enterprise onboarding is quoted separately. The yearly discount applies to the subscription and annually committed extra seats.</p></details><details style="border-top: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 56px; display: flex; align-items: center; font-size: 16px; font-weight: 500">Is there a free trial?</summary><p style="margin: 0 0 18px; max-width: 540px; font-size: 14px; color: #9A9CA5">A 7-day free trial is planned. You will be able to explore the dashboard with sample data. The waitlist opens soon; you will be able to join it on this page.</p></details><details style="border-top: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 56px; display: flex; align-items: center; font-size: 16px; font-weight: 500">Can I connect my current CRM and ad platforms?</summary><p style="margin: 0 0 18px; max-width: 540px; font-size: 14px; color: #9A9CA5">Once demo requests open, tell us what you use. We will confirm which sources can be connected, what data they provide, how often it can refresh and which reports they support.</p></details><details style="border-top: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 56px; display: flex; align-items: center; font-size: 16px; font-weight: 500">Can I bring in historical data?</summary><p style="margin: 0 0 18px; max-width: 540px; font-size: 14px; color: #9A9CA5">Yes, where the source supports it. We will agree the date range, available fields and any cleanup or migration work in your quote.</p></details><details style="border-top: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 56px; display: flex; align-items: center; font-size: 16px; font-weight: 500">Is VAT included?</summary><p style="margin: 0 0 18px; max-width: 540px; font-size: 14px; color: #9A9CA5">Your quote will confirm whether VAT applies and show the total payable before you commit.</p></details><details style="border-top: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 56px; display: flex; align-items: center; font-size: 16px; font-weight: 500">What can I see in the demo today?</summary><p style="margin: 0 0 18px; max-width: 540px; font-size: 14px; color: #9A9CA5">We can walk you through prospect browsing, record details, workspace filtering and role-based views using sample data. We will also show the planned dashboard experience and confirm what is available for your rollout.</p></details></div></div></section><section data-band="1" style="max-width: 1760px; margin: 0 auto; padding: clamp(87px, 14.4vw, 208px) clamp(24px, 5vw, 96px) 0; box-sizing: border-box"><div class="band sv-rise" data-on-mousemove="{{bandMove}}" data-on-mouseleave="{{bandLeave}}" style="border-radius: 20px; padding: clamp(40px, 6vw, 96px) clamp(32px, 5vw, 72px); background: #121316; border: 1px solid rgba(118,52,239,0.18); display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 32px"><canvas ref="{{setBandCanvas}}" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none"></canvas><div style="position: relative; display: flex; flex-direction: column; gap: 14px"><h2 style="margin: 0; max-width: 640px; font-size: clamp(23px, 2.8vw, 34px); line-height: 1.06; letter-spacing: -0.035em; font-weight: 600; text-wrap: balance">The 7-day free trial is coming.</h2><p style="margin: 0; max-width: 520px; font-size: 16px; color: #E2E8F0">When it opens, you can explore the dashboard with sample data, try campaign reporting, check how prospects move through the pipeline, and see how the experience changes for different roles. If you want to test your own sources, we will confirm which connections are supported and which permissions are needed.</p></div><div style="position: relative; display: flex; flex-wrap: wrap; gap: 12px"><a href="About.dc.html?intent=waitlist#contact" class="btn" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 8px; background: #F4F5F7; color: #0A0B0D; font-size: 16px; font-weight: 600; text-decoration: none">Trial waitlist opens soon<span class="arr" aria-hidden="true">&rarr;</span></a><a href="About.dc.html#contact" class="btn2" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 8px; background: transparent; border: 1px solid rgba(244,245,247,0.5); color: #F4F5F7; font-size: 15px; font-weight: 500; text-decoration: none">Demos open soon</a></div></div></section>
