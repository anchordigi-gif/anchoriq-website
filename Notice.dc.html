</section><section data-band="0" style="max-width: 1760px; margin: 0 auto; padding: clamp(72px, 8.3vw, 120px) clamp(24px, 5vw, 96px) 0; box-sizing: border-box"><div class="split" style="align-items: start"><nav aria-label="On this page" class="stk" style="position: sticky; top: 96px; display: flex; flex-direction: column"><a class="nl" href="#s1" style="min-height: 44px; display: flex; align-items: center; border-top: 1px solid #26282E; font-size: 15px">Who we are</a><a class="nl" href="#s2" style="min-height: 44px; display: flex; align-items: center; border-top: 1px solid #26282E; font-size: 15px">What the website records</a><a class="nl" href="#s3" style="min-height: 44px; display: flex; align-items: center; border-top: 1px solid #26282E; font-size: 15px">Why we keep logs</a><a class="nl" href="#s4" style="min-height: 44px; display: flex; align-items: center; border-top: 1px solid #26282E; font-size: 15px">How long we keep them</a><a class="nl" href="#s5" style="min-height: 44px; display: flex; align-items: center; border-top: 1px solid #26282E; font-size: 15px">Where they are stored</a><a class="nl" href="#s6" style="min-height: 44px; display: flex; align-items: center; border-top: 1px solid #26282E; font-size: 15px">Cookies, tracking and forms</a></nav><div><article id="s1" data-rv="1" style="border-top: 1px solid #26282E; padding: 40px 0 48px"><h2 style="margin: 0 0 16px; font-size: clamp(22px, 2.2vw, 30px); font-weight: 500; letter-spacing: -0.02em"><span class="gtxt" aria-hidden="true" style="font-size: 14px; font-weight: 600; margin-right: 14px">01</span>Who we are</h2><p style="margin: 0 0 14px; max-width: 620px; font-size: 16px; color: #C9CBD2">AnchorIQ is a product from Anchor Digital. Anchor Digital runs the anchoriq.io website (&ldquo;we&rdquo;).</p><p style="margin: 0 0 14px; max-width: 620px; font-size: 16px; color: #C9CBD2">Contact us at <a class="nl" href="mailto:hello@anchordigi.com" style="color: #F4F5F7; text-decoration: underline; text-underline-offset: 3px">hello@anchordigi.com</a> or on <a class="nl" href="tel:+971509078947" style="color: #F4F5F7; text-decoration: underline; text-underline-offset: 3px">+971 50 907 8947</a>.</p></article><article id="s2" data-rv="1" style="border-top: 1px solid #26282E; padding: 40px 0 48px"><h2 style="margin: 0 0 16px; font-size: clamp(22px, 2.2vw, 30px); font-weight: 500; letter-spacing: -0.02em"><span class="gtxt" aria-hidden="true" style="font-size: 14px; font-weight: 600; margin-right: 14px">02</span>What the website records</h2><p style="margin: 0 0 14px; max-width: 620px; font-size: 16px; color: #C9CBD2"><strong style="font-weight: 600; color: #F4F5F7">Request log.</strong> When your browser asks for a page, image or file, our web server writes one line to its request log: your IP address, the date and time, the address of the page or file (without anything after a question mark), the response code and how long the response took.</p><p style="margin: 0 0 14px; max-width: 620px; font-size: 16px; color: #C9CBD2">The request log does not record your name, your email address, your browser type, the page you came from, or anything you type.</p><p style="margin: 0 0 14px; max-width: 620px; font-size: 16px; color: #C9CBD2"><strong style="font-weight: 600; color: #F4F5F7">Error log.</strong> Separately, the server keeps an error log. Rarely, a serious error message in it can include an IP address.</p></article><article id="s3" data-rv="1" style="border-top: 1px solid #26282E; padding: 40px 0 48px"><h2 style="margin: 0 0 16px; font-size: clamp(22px, 2.2vw, 30px); font-weight: 500; letter-spacing: -0.02em"><span class="gtxt" aria-hidden="true" style="font-size: 14px; font-weight: 600; margin-right: 14px">03</span>Why we keep logs</h2><p style="margin: 0 0 14px; max-width: 620px; font-size: 16px; color: #C9CBD2">We use these logs to operate, secure, and troubleshoot the website. We do not sell them or use them for marketing.</p></article><article id="s4" data-rv="1" style="border-top: 1px solid #26282E; padding: 40px 0 48px"><h2 style="margin: 0 0 16px; font-size: clamp(22px, 2.2vw, 30px); font-weight: 500; letter-spacing: -0.02em"><span class="gtxt" aria-hidden="true" style="font-size: 14px; font-weight: 600; margin-right: 14px">04</span>How long we keep them</h2><p style="margin: 0 0 14px; max-width: 620px; font-size: 16px; color: #C9CBD2"><strong style="font-weight: 600; color: #F4F5F7">Request logs: 14 days.</strong> Each day&rsquo;s requests are stored in a separate file, and a daily job deletes each file automatically 14 days after the day it covers.</p><p style="margin: 0 0 14px; max-width: 620px; font-size: 16px; color: #C9CBD2"><strong style="font-weight: 600; color: #F4F5F7">Error log: limited by size, not by days.</strong> It has a fixed maximum size. When it is full, its oldest entries are overwritten by new ones, so how long an entry stays depends on how many errors occur.</p></article><article id="s5" data-rv="1" style="border-top: 1px solid #26282E; padding: 40px 0 48px"><h2 style="margin: 0 0 16px; font-size: clamp(22px, 2.2vw, 30px); font-weight: 500; letter-spacing: -0.02em"><span class="gtxt" aria-hidden="true" style="font-size: 14px; font-weight: 600; margin-right: 14px">05</span>Where they are stored</h2><p style="margin: 0 0 14px; max-width: 620px; font-size: 16px; color: #C9CBD2">The website and its logs are on a virtual private server that we rent from Hostinger, in its data centre in Mumbai, India.</p></article><article id="s6" data-rv="1" style="border-top: 1px solid #26282E; padding: 40px 0 48px"><h2 style="margin: 0 0 16px; font-size: clamp(22px, 2.2vw, 30px); font-weight: 500; letter-spacing: -0.02em"><span class="gtxt" aria-hidden="true" style="font-size: 14px; font-weight: 600; margin-right: 14px">06</span>Cookies, tracking and forms</h2><p style="margin: 0 0 14px; max-width: 620px; font-size: 16px; color: #C9CBD2">The website sets no cookies, uses no analytics, advertising or tracking tags, and loads nothing from other websites.</p><p style="margin: 0 0 14px; max-width: 620px; font-size: 16px; color: #C9CBD2">Demo requests and the trial waitlist are closed, so the website does not collect your contact details.</p><p style="margin: 0 0 14px; max-width: 620px; font-size: 16px; color: #C9CBD2">Last updated: 15 November 2026.</p></article></div></div></section>
