<div data-step="1" style="min-height: 440px; display: flex; flex-direction: column; justify-content: center; gap: 14px; border-top: 1px solid #26282E"><h3 style="margin: 0; font-size: clamp(24px, 2.4vw, 34px); line-height: 1.15; letter-spacing: -0.02em; font-weight: 500">An agent makes contact</h3><p style="margin: 0; max-width: 520px; font-size: 17px; color: #9A9CA5">The lead lands in an agent's queue. First contact is timed against a 30 minute target, and a miss escalates to the team leader.</p></div>

<section id="product" style="max-width: 1760px; margin: 0 auto; padding: clamp(87px, 14.4vw, 208px) clamp(24px, 5vw, 96px) 0; box-sizing: border-box">

<p style="margin: 20px 0 0; font-size: 17px; color: #9A9CA5">Follow leads across ten stages, open any stage as a list, and see how each lead moved. New leads with no contact attempt are surfaced first, because they are the ones that go cold.</p>

<div style="padding: 14px clamp(10px, 1.2vw, 16px); border-radius: 10px; border: 1px solid #26282E; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #9A9CA5">Qualified share</span><strong class="gtx" style="font-size: clamp(19px, 2.4vw, 34px); line-height: 1.1; letter-spacing: -0.025em; font-variant-numeric: tabular-nums">{{qRateText}}%</strong></div>
</div>
<div data-on-mousemove="{{chartMove}}" data-on-mouseleave="{{chartLeave}}" style="position: relative; cursor: crosshair">
<svg viewBox="0 0 600 240" role="img" aria-label="{{areaAria}}" style="display: block; width: 100%; height: auto; overflow: visible">
<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7634EF" stop-opacity="0.5"></stop><stop offset="1" stop-color="#7634EF" stop-opacity="0"></stop></linearGradient><linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7634EF"></stop><stop offset="1" stop-color="#E028DF"></stop></linearGradient></defs>
<line x1="30" y1="40" x2="570" y2="40" stroke="#26282E" stroke-width="1" stroke-dasharray="2 6"></line>
<line x1="30" y1="120" x2="570" y2="120" stroke="#26282E" stroke-width="1" stroke-dasharray="2 6"></line>

<rect x="{{bandX}}" y="24" width="60" height="176" rx="6" fill="#7634EF" style="opacity: {{bandO}}; transition: x .2s cubic-bezier(.2,.7,.2,1), opacity .2s ease-out"></rect>

<path data-line="1" d="{{lineD}}" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition: d .7s cubic-bezier(.2,.7,.2,1)"></path>
<path d="{{dotsD}}" fill="#121316" stroke="#7634EF" stroke-width="1.5" style="transition: d .7s cubic-bezier(.2,.7,.2,1)"></path>

<circle cx="570" cy="{{lastY}}" r="4" fill="#E028DF" style="transition: cy .7s cubic-bezier(.2,.7,.2,1)"></circle>
<line x1="{{hovX}}" y1="24" x2="{{hovX}}" y2="200" stroke="#F4F5F7" stroke-width="1" stroke-dasharray="4 4" style="opacity: {{hovO}}; transition: x1 .2s cubic-bezier(.2,.7,.2,1), x2 .2s cubic-bezier(.2,.7,.2,1), opacity .2s ease-out"></line>
<circle cx="{{hovX}}" cy="{{hovY}}" r="7" fill="#0A0B0D" stroke="#E028DF" stroke-width="2.5" style="opacity: {{hovO}}; transition: cx .2s cubic-bezier(.2,.7,.2,1), cy .2s cubic-bezier(.2,.7,.2,1), opacity .2s ease-out"></circle>

</div>

<p aria-live="polite" style="margin: 8px 0 0; padding-top: 16px; border-top: 1px solid #26282E; min-height: 44px; font-size: 14px; color: #F4F5F7">{{chartNote}}</p>

<section id="teams" style="max-width: 1760px; margin: 0 auto; padding: clamp(87px, 14.4vw, 208px) clamp(24px, 5vw, 96px) 0; box-sizing: border-box">

<div style="display: flex; flex-direction: column; gap: 6px"><label for="f-email" style="font-size: 14px; font-weight: 500">Work email</label><input id="f-email" name="email" type="email" autocomplete="email" placeholder="name@company.com" value="{{f.email}}" data-on-change="{{onField}}" aria-describedby="e-email" style="font: inherit; min-height: 44px; padding: 0 12px; border: 1px solid #4A4D57; border-radius: 8px; background: #0A0B0D; color: #F4F5F7"><span id="e-email" role="alert" style="font-size: 13px; color: #FCA5A5; min-height: 18px">{{err.email}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="f-company" style="font-size: 14px; font-weight: 500">Company name</label><input id="f-company" name="company" type="text" autocomplete="organization" placeholder="Where you work" value="{{f.company}}" data-on-change="{{onField}}" aria-describedby="e-company" style="font: inherit; min-height: 44px; padding: 0 12px; border: 1px solid #4A4D57; border-radius: 8px; background: #0A0B0D; color: #F4F5F7"><span id="e-company" role="alert" style="font-size: 13px; color: #FCA5A5; min-height: 18px">{{err.company}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="f-industry" style="font-size: 14px; font-weight: 500">Industry</label><select id="f-industry" name="industry" value="{{f.industry}}" data-on-change="{{onField}}" aria-describedby="e-industry" style="font: inherit; min-height: 44px; padding: 0 10px; border: 1px solid #4A4D57; border-radius: 8px; background: #0A0B0D; color: #F4F5F7"><option value="">Select an industry</option><option>Real estate and property</option><option>Marketing or advertising agency</option><option>Automotive</option><option>Education and training</option><option>Healthcare and clinics</option><option>Financial services and insurance</option><option>Retail and e-commerce</option><option>Hospitality and travel</option><option>Technology and software</option><option>Professional services</option><option>Construction and home services</option><option>Recruitment and staffing</option><option>Multi-location or franchise business</option><option>Other</option></select><span id="e-industry" role="alert" style="font-size: 13px; color: #FCA5A5; min-height: 18px">{{err.industry}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="f-size" style="font-size: 14px; font-weight: 500">Team size</label><select id="f-size" name="size" value="{{f.size}}" data-on-change="{{onField}}" style="font: inherit; min-height: 44px; padding: 0 10px; border: 1px solid #4A4D57; border-radius: 8px; background: #0A0B0D; color: #F4F5F7"><option value="">Select a size</option><option>Just me</option><option>2 to 10</option><option>11 to 50</option><option>51 to 200</option><option>201 to 500</option><option>More than 500</option></select><span style="min-height: 18px"></span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="f-challenge" style="font-size: 14px; font-weight: 500">Primary reporting challenge</label><select id="f-challenge" name="challenge" value="{{f.challenge}}" data-on-change="{{onField}}" style="font: inherit; min-height: 44px; padding: 0 10px; border: 1px solid #4A4D57; border-radius: 8px; background: #0A0B0D; color: #F4F5F7"><option value="">Select a challenge</option><option>Lead quality by campaign</option><option>Marketing spend and return</option><option>Pipeline and conversion visibility</option><option>Slow or missed lead follow-up</option><option>Agent and team performance</option><option>Reporting across several tools</option><option>Reporting still done in spreadsheets</option><option>Listings and portals</option><option>Client reporting for an agency</option><option>Leadership and board reporting</option><option>Other</option></select><span style="min-height: 18px"></span></div>
<div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px"><label for="f-message" style="font-size: 14px; font-weight: 500">Message <span style="font-weight: 400; color: #9A9CA5">(optional)</span></label><textarea id="f-message" name="message" rows="4" placeholder="Platforms you use, how many people need access, what you want to report on" value="{{f.message}}" data-on-change="{{onField}}" style="font: inherit; padding: 10px 12px; border: 1px solid #4A4D57; border-radius: 8px; background: #0A0B0D; color: #F4F5F7; resize: vertical"></textarea></div>
<div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
<button type="submit" class="btn send" aria-busy="{{busy}}" style="font: inherit; font-size: 16px; font-weight: 600; min-height: 48px; padding: 0 22px; border: 0; border-radius: 8px; background: #F4F5F7; color: #0A0B0D; cursor: pointer; transition: opacity .2s ease-out; {{sendStyle}}">{{sendLabel}}<span class="arr" aria-hidden="true">&rarr;</span></button>
<span role="alert" style="font-size: 14px; line-height: 1.5; color: #FCA5A5; min-height: 21px">{{formError}}</span>
</div>

<section id="faq" style="max-width: 1760px; margin: 0 auto; padding: clamp(87px, 14.4vw, 208px) clamp(24px, 5vw, 96px) 0; box-sizing: border-box">
<div class="split" style="align-items: start">
<h2 data-rv="1" style="margin: 0; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.12; letter-spacing: -0.025em; font-weight: 500">Questions buyers ask first.</h2>
<div style="display: flex; flex-direction: column">
<details style="border-top: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 52px; display: flex; align-items: center; font-size: 17px; font-weight: 500">What does AnchorIQ connect to?</summary><p style="margin: 0 0 18px; font-size: 15px; color: #9A9CA5">Planned connections cover CRM systems, property portals, advertising accounts, web analytics and spreadsheet imports. None is live yet. Tell us what you use and we will confirm what your rollout can include.</p></details>
<details style="border-top: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 52px; display: flex; align-items: center; font-size: 17px; font-weight: 500">Is AnchorIQ only for real estate?</summary><p style="margin: 0 0 18px; font-size: 15px; color: #9A9CA5">It is built for brokerages first. Branding, terminology, modules and workspaces are set per company, so a sales team outside property uses the same platform with the listing modules switched off.</p></details>
<details style="border-top: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 52px; display: flex; align-items: center; font-size: 17px; font-weight: 500">Does AnchorIQ change records in our CRM?</summary><p style="margin: 0 0 18px; font-size: 15px; color: #9A9CA5">No. AnchorIQ is reporting only by default. Writing stages or notes back to the CRM is planned as a setting you choose to turn on.</p></details>
<details style="border-top: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 52px; display: flex; align-items: center; font-size: 17px; font-weight: 500">Who can see what?</summary><p style="margin: 0 0 18px; font-size: 15px; color: #9A9CA5">Access follows role: agent, team leader, manager and management. Each role sees a different home screen and a different scope of leads, and you can rename the roles to match your organisation.</p></details>
<details style="border-top: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 52px; display: flex; align-items: center; font-size: 17px; font-weight: 500">Are the screens on this page real data?</summary><p style="margin: 0 0 18px; font-size: 15px; color: #9A9CA5">No. The dashboard screens and every chart on this page use sample data. Nothing here comes from a customer account.</p></details>
<details style="border-top: 1px solid #26282E; border-bottom: 1px solid #26282E; padding: 4px 0"><summary style="cursor: pointer; min-height: 52px; display: flex; align-items: center; font-size: 17px; font-weight: 500">How is pricing set?</summary><p style="margin: 0 0 18px; font-size: 15px; color: #9A9CA5">By the size of your teams and the modules and connections you need. Once demo requests open, we will send a tailored proposal.</p></details>
</div>
</div>
</section>
